name: Check for new company blog posts

on:
  schedule:
    # 13:00 UTC daily
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-blog-extraction
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check company blog sources for new posts
        run: node scripts/check-new-blogs.mjs

      - name: Commit any newly discovered posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pending-posts.json data/known-posts.json
          if git diff --cached --quiet; then
            echo "No new blog candidates found."
            exit 0
          fi
          git commit -m "chore: check for new company blog posts ($(date -u +%F))"
          git push
