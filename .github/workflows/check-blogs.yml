name: Check for new company blog posts

on:
  schedule:
    # 7:00 AM Chicago time daily, alongside the paper refresh.
    - cron: '0 7 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-blog-extraction
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test blog extraction
        run: node --test scripts/fetch-with-retry.test.mjs scripts/check-new-blogs.test.mjs

      - name: Check company blog sources for new posts
        run: node scripts/check-new-blogs.mjs

      - name: Commit any newly discovered posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pending-posts.json data/known-posts.json index.html
          if git diff --cached --quiet; then
            echo "No new blog candidates found."
            exit 0
          fi
          git commit -m "chore: check for new company blog posts ($(date -u +%F))"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            echo "Push raced with another update; rebasing before retry $((attempt + 1))/3."
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
