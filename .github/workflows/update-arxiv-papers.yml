name: Update arXiv papers

on:
  schedule:
    # 7:00 AM Chicago time daily, alongside the company-post refresh.
    - cron: '0 7 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-arxiv-extraction
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test paper extraction
        run: node --test scripts/fetch-with-retry.test.mjs scripts/update-arxiv-papers.test.mjs scripts/paper-corpus.test.mjs

      - name: Extract arXiv papers
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=(--allow-stale)
          fi
          if [ "$(TZ=America/Chicago date +%u)" = "7" ]; then
            echo "Running the weekly full arXiv reconciliation."
            node scripts/update-arxiv-papers.mjs --full "${args[@]}"
          else
            echo "Running the daily incremental arXiv refresh."
            node scripts/update-arxiv-papers.mjs "${args[@]}"
          fi

      - name: Refresh the Paper tab corpus
        if: steps.extract.outputs.refreshed == 'true'
        run: node scripts/paper-corpus.mjs refresh-arxiv

      - name: Commit the refreshed paper data
        if: steps.extract.outputs.refreshed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arxiv-papers.js data/research-papers.json
          if git diff --cached --quiet; then
            echo "No arXiv paper changes found."
            exit 0
          fi
          git commit -m "chore: refresh arXiv papers ($(date -u +%F))"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            echo "Push raced with another update; rebasing before retry $((attempt + 1))/3."
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
